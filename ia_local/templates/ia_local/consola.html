<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSMITT-ia-L</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        textarea {
            box-sizing: border-box;
            min-height: 7rem;
            width: 100%;
        }
        pre {
            background: #f4f4f4;
            overflow: auto;
            padding: 1rem;
            white-space: pre-wrap;
        }
        .error {
            color: #a00;
        }
    </style>
</head>
<body>
    <h1>TRANSMITT-ia-L</h1>

    <form method="post">
        {% csrf_token %}
        <label for="pregunta">Pregunta</label>
        <textarea id="pregunta" name="pregunta" required>{{ pregunta }}</textarea>
        <p><button type="submit">Consultar</button></p>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if respuesta %}
        <h2>Respuesta</h2>
        <pre>{{ respuesta }}</pre>
    {% endif %}

    {% if plan %}
        <details>
            <summary>Plan normalizado</summary>
            <pre>{{ plan|pprint }}</pre>
        </details>
    {% endif %}

    {% if resultado %}
        <details>
            <summary>Resultado ORM</summary>
            <pre>{{ resultado|pprint }}</pre>
        </details>
    {% endif %}
</body>
</html>
