<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSMITT-ia-L</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f4f7fb;
        }

        body {
            align-items: center;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        main {
            max-width: 760px;
            padding: 2rem;
            width: calc(100% - 4rem);
        }

        h1 {
            font-size: clamp(2rem, 7vw, 4.5rem);
            letter-spacing: 0.08em;
            margin: 0;
            text-align: center;
        }

        .consulta {
            background: #182338;
            border: 1px solid #2d405f;
            border-radius: 16px;
            margin-top: 2rem;
            padding: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.6rem;
        }

        textarea {
            background: #0d1524;
            border: 1px solid #405575;
            border-radius: 8px;
            box-sizing: border-box;
            color: inherit;
            font: inherit;
            min-height: 5rem;
            padding: 0.75rem;
            resize: vertical;
            width: 100%;
        }

        button {
            background: #49b7a5;
            border: 0;
            border-radius: 8px;
            color: #07151a;
            cursor: pointer;
            font-weight: bold;
            margin-top: 0.75rem;
            padding: 0.7rem 1.1rem;
        }

        button.secundario {
            background: #405575;
            color: #f4f7fb;
            margin-left: 0.5rem;
        }

        #respuesta {
            white-space: pre-wrap;
            margin-bottom: 0;
        }

        .ejemplo {
            color: #aebbd0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>TRANSMITT-ia-L</h1>
        <section class="consulta" aria-labelledby="consulta-titulo">
            <h2 id="consulta-titulo">Consulta documental</h2>
            <p class="ejemplo">Ejemplo: ¿cuántos archivos adjuntos tiene el transmittal ODATA-BUF-CM-TTAL-00184?</p>
            <form id="consulta-form" action="{% url 'ia_local:consultar' %}" method="post">
                {% csrf_token %}
                <label for="pregunta">Escribe tu consulta</label>
                <textarea id="pregunta" name="pregunta" required placeholder="¿Cuántos archivos adjuntos tiene el TTAL-184?"></textarea>
                <button type="submit">Consultar</button>
                <button type="button" class="secundario" id="limpiar">Limpiar</button>
            </form>
            <p id="respuesta" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script>
        const form = document.getElementById("consulta-form");
        const respuesta = document.getElementById("respuesta");
        const pregunta = document.getElementById("pregunta");

        document.getElementById("limpiar").addEventListener("click", () => {
            pregunta.value = "";
            respuesta.textContent = "";
            pregunta.focus();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            respuesta.textContent = "Consultando...";
            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {"X-Requested-With": "XMLHttpRequest"}
                });
                const data = await response.json();
                respuesta.textContent = data.respuesta || data.error || "No fue posible completar la consulta.";
            } catch (error) {
                respuesta.textContent = "No fue posible conectar con el servicio de consultas.";
            }
        });
    </script>
</body>
</html>
