<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRANSMITT-ia-L</title>

    <style>

        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f4f7fb;
        }

        body {
            align-items: center;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }

        main {
            max-width: 760px;
            padding: 2rem;
            width: calc(100% - 4rem);
        }

        h1 {
            font-size: clamp(2rem, 7vw, 4.5rem);
            letter-spacing: 0.08em;
            margin: 0;
            text-align: center;
        }

        .consulta {
            background: #182338;
            border: 1px solid #2d405f;
            border-radius: 16px;
            margin-top: 2rem;
            padding: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.6rem;
        }

        textarea {
            background: #0d1524;
            border: 1px solid #405575;
            border-radius: 8px;
            box-sizing: border-box;
            color: inherit;
            font: inherit;
            min-height: 5rem;
            padding: 0.75rem;
            resize: vertical;
            width: 100%;
        }

        button {
            background: #49b7a5;
            border: 0;
            border-radius: 8px;
            color: #07151a;
            cursor: pointer;
            font-weight: bold;
            margin-top: 0.75rem;
            padding: 0.7rem 1.1rem;
        }

        button.secundario {
            background: #405575;
            color: #f4f7fb;
            margin-left: 0.5rem;
        }

        button.excel {
            background: #3fa66b;
            color: #07151a;
        }

        button.pdf {
            background: #d06767;
            color: #1b0808;
            margin-left: 0.5rem;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        #respuesta {
            white-space: pre-wrap;
            margin-bottom: 0;
        }

        .ejemplo {
            color: #aebbd0;
            font-size: 0.9rem;
        }

        .exportaciones {
            border-top: 1px solid #2d405f;
            display: none;
            margin-top: 1rem;
            padding-top: 0.5rem;
        }

        .exportaciones form {
            display: inline;
        }

    </style>

</head>

<body>

    <main>

        <h1>
            TRANSMITT-ia-L
        </h1>

        <section
            class="consulta"
            aria-labelledby="consulta-titulo"
        >

            <h2 id="consulta-titulo">
                Consulta documental
            </h2>

            <p class="ejemplo">
                Ejemplo:
                ¿cuántos archivos adjuntos tiene el
                transmittal ODATA-BUF-CM-TTAL-00184?
            </p>

            <!--
            ==================================================
            CONSULTA IA
            ==================================================
            Conservamos el nombre de URL que YA tienes:
            name="consultar"
            ==================================================
            -->

            <form
                id="consulta-form"
                action="{% url 'ia_local:consultar' %}"
                method="post"
            >

                {% csrf_token %}

                <label for="pregunta">
                    Escribe tu consulta
                </label>

                <textarea
                    id="pregunta"
                    name="pregunta"
                    required
                    placeholder="¿Cuántos archivos adjuntos tiene el TTAL-184?"
                ></textarea>

                <button
                    type="submit"
                    id="btn-consultar"
                >
                    Consultar
                </button>

                <button
                    type="button"
                    class="secundario"
                    id="limpiar"
                >
                    Limpiar
                </button>

            </form>


            <!--
            ==================================================
            RESULTADO
            ==================================================
            -->

            <p
                id="respuesta"
                role="status"
                aria-live="polite"
            ></p>


            <!--
            ==================================================
            EXPORTACIONES
            ==================================================
            -->

            <div
                class="exportaciones"
                id="exportaciones"
            >

                <!-- EXCEL -->

                <form
                    id="form-excel"
                    action="{% url 'ia_local:exportar_resultado_excel' %}"
                    method="post"
                >

                    {% csrf_token %}

                    <input
                        type="hidden"
                        name="pregunta"
                        id="excel-pregunta"
                    >

                    <input
                        type="hidden"
                        name="respuesta_json"
                        id="excel-respuesta"
                    >

                    <button
                        type="submit"
                        class="excel"
                        id="btn-excel"
                        disabled
                    >
                        Descargar Excel
                    </button>

                </form>


                <!-- PDF -->

                <form
                    id="form-pdf"
                    action="{% url 'ia_local:exportar_resultado_pdf' %}"
                    method="post"
                    target="_blank"
                >

                    {% csrf_token %}

                    <input
                        type="hidden"
                        name="pregunta"
                        id="pdf-pregunta"
                    >

                    <input
                        type="hidden"
                        name="respuesta_json"
                        id="pdf-respuesta"
                    >

                    <button
                        type="submit"
                        class="pdf"
                        id="btn-pdf"
                        disabled
                    >
                        Ver / Descargar PDF
                    </button>

                </form>

            </div>

        </section>

    </main>


    <script>

        /*
        ======================================================
        REFERENCIAS DOM
        ======================================================
        */

        const form =
            document.getElementById(
                "consulta-form"
            );

        const respuesta =
            document.getElementById(
                "respuesta"
            );

        const pregunta =
            document.getElementById(
                "pregunta"
            );

        const botonConsultar =
            document.getElementById(
                "btn-consultar"
            );

        const exportaciones =
            document.getElementById(
                "exportaciones"
            );

        const botonExcel =
            document.getElementById(
                "btn-excel"
            );

        const botonPdf =
            document.getElementById(
                "btn-pdf"
            );


        /*
        ======================================================
        ESTADO EXPORTACIONES
        ======================================================
        */

        function desactivarExportaciones() {

            botonExcel.disabled = true;
            botonPdf.disabled = true;

            exportaciones.style.display =
                "none";

            document
                .getElementById(
                    "excel-pregunta"
                )
                .value = "";

            document
                .getElementById(
                    "pdf-pregunta"
                )
                .value = "";

            document
                .getElementById(
                    "excel-respuesta"
                )
                .value = "";

            document
                .getElementById(
                    "pdf-respuesta"
                )
                .value = "";

        }


        function activarExportaciones(
            textoPregunta,
            respuestaEstructurada
        ) {

            /*
            La vista de exportación recibe exactamente
            la respuesta ya obtenida.

            NO vuelve a ejecutar Qwen.
            */

            const respuestaJSON =
                JSON.stringify(
                    respuestaEstructurada
                );

            document
                .getElementById(
                    "excel-pregunta"
                )
                .value =
                textoPregunta;

            document
                .getElementById(
                    "pdf-pregunta"
                )
                .value =
                textoPregunta;

            document
                .getElementById(
                    "excel-respuesta"
                )
                .value =
                respuestaJSON;

            document
                .getElementById(
                    "pdf-respuesta"
                )
                .value =
                respuestaJSON;

            botonExcel.disabled = false;
            botonPdf.disabled = false;

            exportaciones.style.display =
                "block";

        }


        /*
        ======================================================
        LIMPIAR
        ======================================================
        */

        document
            .getElementById(
                "limpiar"
            )
            .addEventListener(
                "click",
                () => {

                    pregunta.value = "";

                    respuesta.textContent =
                        "";

                    desactivarExportaciones();

                    pregunta.focus();

                }
            );


        /*
        ======================================================
        CONSULTA IA
        ======================================================
        */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const textoPregunta =
                    pregunta.value.trim();

                if (!textoPregunta) {

                    respuesta.textContent =
                        "Escribe una consulta.";

                    pregunta.focus();

                    return;
                }


                /*
                ------------------------------------------------
                Estado inicial
                ------------------------------------------------
                */

                respuesta.textContent =
                    "Consultando...";

                botonConsultar.disabled =
                    true;

                desactivarExportaciones();


                try {

                    /*
                    ------------------------------------------------
                    Ejecutamos consulta
                    ------------------------------------------------
                    */

                    const response =
                        await fetch(
                            form.action,
                            {
                                method:
                                    "POST",

                                body:
                                    new FormData(
                                        form
                                    ),

                                headers: {
                                    "X-Requested-With":
                                        "XMLHttpRequest"
                                }
                            }
                        );


                    /*
                    ------------------------------------------------
                    IMPORTANTE

                    Primero leemos como TEXTO.

                    De este modo si Django devuelve HTML
                    por un 403, 404, 500, login, etc.,
                    NO ejecutamos response.json() sobre HTML.
                    ------------------------------------------------
                    */

                    const contenido =
                        await response.text();


                    const contentType =
                        response.headers.get(
                            "content-type"
                        ) || "";


                    /*
                    ------------------------------------------------
                    Verificamos que Django realmente haya
                    enviado JSON.
                    ------------------------------------------------
                    */

                    if (
                        !contentType.includes(
                            "application/json"
                        )
                    ) {

                        console.error(
                            "Respuesta no JSON:",
                            contenido
                        );

                        throw new Error(
                            "El servidor no devolvió JSON "
                            + "(HTTP "
                            + response.status
                            + "). Revisa el log de Django."
                        );

                    }


                    /*
                    ------------------------------------------------
                    Ahora sí parseamos.
                    ------------------------------------------------
                    */

                    let data;

                    try {

                        data =
                            JSON.parse(
                                contenido
                            );

                    }
                    catch (errorJSON) {

                        console.error(
                            "JSON inválido:",
                            contenido
                        );

                        throw new Error(
                            "El servidor devolvió una "
                            + "respuesta JSON inválida."
                        );

                    }


                    /*
                    ------------------------------------------------
                    Error enviado correctamente como JSON.
                    ------------------------------------------------
                    */

                    if (
                        !response.ok ||
                        data.ok === false
                    ) {

                        throw new Error(
                            data.error ||
                            (
                                "No fue posible completar "
                                + "la consulta."
                            )
                        );

                    }


                    /*
                    ------------------------------------------------
                    RESPUESTA VISIBLE

                    Conservamos el comportamiento anterior.
                    ------------------------------------------------
                    */

                    if (
                        typeof data.respuesta ===
                        "string"
                    ) {

                        respuesta.textContent =
                            data.respuesta;

                    }
                    else if (
                        data.respuesta !== undefined &&
                        data.respuesta !== null
                    ) {

                        respuesta.textContent =
                            JSON.stringify(
                                data.respuesta,
                                null,
                                2
                            );

                    }
                    else if (
                        data.respuesta_estructurada
                    ) {

                        respuesta.textContent =
                            JSON.stringify(
                                data.respuesta_estructurada,
                                null,
                                2
                            );

                    }
                    else {

                        respuesta.textContent =
                            "Consulta procesada "
                            + "sin contenido visible.";

                    }


                    /*
                    ------------------------------------------------
                    RESPUESTA PARA EXPORTAR
                    ------------------------------------------------

                    Prioridad:

                    1. respuesta_estructurada
                    2. respuesta si ya es objeto
                    3. intentar interpretar respuesta textual
                    4. generar estructura mínima

                    El fallo de JSON.parse aquí NO rompe
                    la consulta porque está protegido.
                    ------------------------------------------------
                    */

                    let resultadoExportable =
                        null;


                    if (
                        data.respuesta_estructurada &&
                        typeof data.respuesta_estructurada
                            === "object"
                    ) {

                        resultadoExportable =
                            data.respuesta_estructurada;

                    }
                    else if (
                        data.respuesta &&
                        typeof data.respuesta
                            === "object"
                    ) {

                        resultadoExportable =
                            data.respuesta;

                    }
                    else if (
                        typeof data.respuesta ===
                        "string"
                    ) {

                        try {

                            resultadoExportable =
                                JSON.parse(
                                    data.respuesta
                                );

                        }
                        catch (
                            errorRespuesta
                        ) {

                            /*
                            La respuesta es texto normal.
                            La encapsulamos.

                            No es un error.
                            */

                            resultadoExportable = {
                                tipo:
                                    "respuesta_texto",

                                total:
                                    data.total ?? null,

                                respuesta:
                                    data.respuesta
                            };

                        }

                    }


                    /*
                    ------------------------------------------------
                    Habilitamos exportación solamente si existe
                    algo realmente exportable.
                    ------------------------------------------------
                    */

                    if (
                        resultadoExportable &&
                        typeof resultadoExportable
                            === "object"
                    ) {

                        activarExportaciones(
                            textoPregunta,
                            resultadoExportable
                        );

                    }

                }
                catch (error) {

                    console.error(
                        error
                    );

                    respuesta.textContent =
                        error.message ||
                        (
                            "No fue posible conectar "
                            + "con el servicio de consultas."
                        );

                    desactivarExportaciones();

                }
                finally {

                    botonConsultar.disabled =
                        false;

                }

            }
        );


        /*
        ======================================================
        ESTADO INICIAL
        ======================================================
        */

        desactivarExportaciones();

    </script>

</body>

</html>
