services:
  transmitt_ia_l:
    build:
      context: .
      dockerfile: ./Dockerfile

    container_name: transmitt_ia_l_app
    restart: unless-stopped

    # Permite que ia_local alcance Ollama instalado en el host VPS.
    # En Linux, host-gateway resuelve host.docker.internal hacia el host Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-transmitt-ia-l.netgogo.cl}"
      DJANGO_SETTINGS_MODULE: "transmitt_ia_l.settings"

      # PostgreSQL del proyecto anfitrión.
      # No se fuerza ningún nombre de base de datos perteneciente a Condocdat.
      DB_ENGINE: "${DB_ENGINE:-django.db.backends.postgresql}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-5432}"

      # Configuración que consume realmente ia_local/services/host/respuesta_llm.py.
      IA_LOCAL_OLLAMA_URL: "${IA_LOCAL_OLLAMA_URL:-http://host.docker.internal:11434}"
      IA_LOCAL_OLLAMA_MODEL: "${IA_LOCAL_OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      IA_LOCAL_OLLAMA_TIMEOUT: "${IA_LOCAL_OLLAMA_TIMEOUT:-180}"

      TZ: "America/Santiago"

    volumes:
      # Únicamente archivos estáticos generados por este proyecto.
      - ./staticfiles:/app/staticfiles

    networks:
      # Traefik publica el subdominio HTTPS.
      - traefik_default

      # Red de infraestructura necesaria para alcanzar PostgreSQL cuando
      # DB_HOST es un contenedor externo. No monta ni comparte archivos.
      - myproject_netgogo_default

    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik_default"
      traefik.http.routers.transmitt-ia-l.entrypoints: "websecure"
      traefik.http.routers.transmitt-ia-l.rule: "Host(`transmitt-ia-l.netgogo.cl`)"
      traefik.http.routers.transmitt-ia-l.tls.certresolver: "letsencrypt"
      traefik.http.services.transmitt-ia-l.loadbalancer.server.port: "8000"
      traefik.http.middlewares.transmitt-ia-l-headers.headers.customrequestheaders.X-Forwarded-Proto: "https"
      traefik.http.routers.transmitt-ia-l.middlewares: "transmitt-ia-l-headers"

networks:
  traefik_default:
    external: true

  myproject_netgogo_default:
    external: true
